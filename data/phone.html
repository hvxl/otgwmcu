<script type="text/javascript">
class Setpoint {
    constructor(name, min, max, step, command) {
	this.w = document.getElementById(name)
	this.min = min
	this.max = max
	this.step = step
	this.command = command
	this.request = null
    }

    control(op) {
	if (!this.request) {
	    this.request = parseFloat(w.value)
	}
	if (op == "Up") {
	    this.request += this.step
	} else if (op == "Down") {
	    this.request -+ this.step
	} else {
	    return
	}
	this.request = Math.round(this.request / this.step) * this.step
	command(this.command + "=" + this.request)
	this.show(this.request)
	return false
    }

    parts(unit, half) {
	this.unitid = document.getElementById(unit)
	this.halfid = document.getElementById(half)
    }

    show(value) {
	this.w.value = value
	if (this.unitid) {
	    let num = Math.floor(value)
	    this.unitid.innerHTML = num
	    if (this.halfid) {
		this.halfid.innerHTML = value - num >= 0.5 ? ".5" : ".0"
	    }
	}
    }

    set(value) {
	this.show(value)
	this.request = value
    }
}

function command(str) {
    const xhr = new XMLHttpRequest()
    xhr.open("POST", "/command.cgi", true)
    xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded")
    xhr.send("cmd=" + str)
}

const roomsetpoint = new Setpoint('msgid16', 5, 30, 0.5, 'TT')
roomsetpoint.parts('msgid16-units', 'msgid16-half')

</script>
